name: ga-release-aggregate

on:
  workflow_dispatch:
    inputs:
      operator_packages_repository:
        description: Repository containing the four operator-inputs package artifacts.
        required: true
        default: agentsmith-project/agentsmith-release-kit
        type: string
      operator_packages_run_id:
        description: Workflow run id that produced the four operator-inputs package artifacts.
        required: true
        type: string
      product_reports_repository:
        description: Repository containing AgentSmith product readiness and smoke artifacts.
        required: true
        default: agentsmith-project/agentsmith
        type: string
      product_reports_run_id:
        description: Workflow run id that produced AgentSmith product readiness and smoke artifacts.
        required: true
        type: string
      online_use_existing_artifact:
        description: Artifact name for the online/use_existing operator-inputs package.
        required: true
        default: agentsmith-ga-online-use-existing-operator-inputs
        type: string
      online_install_substrates_artifact:
        description: Artifact name for the online/install_substrates operator-inputs package.
        required: true
        default: agentsmith-ga-online-install-substrates-operator-inputs
        type: string
      airgap_use_existing_artifact:
        description: Artifact name for the airgap/use_existing operator-inputs package.
        required: true
        default: agentsmith-ga-airgap-use-existing-operator-inputs
        type: string
      airgap_install_substrates_artifact:
        description: Artifact name for the airgap/install_substrates operator-inputs package.
        required: true
        default: agentsmith-ga-airgap-install-substrates-operator-inputs
        type: string
      product_readiness_artifact:
        description: Artifact name containing product-readiness-report.json.
        required: true
        default: agentsmith-product-readiness
        type: string
      online_post_deploy_product_smoke_artifact:
        description: Artifact name containing the online post-deploy-product-smoke-report.json.
        required: true
        default: agentsmith-post-deploy-product-smoke-report
        type: string
      airgap_post_deploy_product_smoke_artifact:
        description: Artifact name containing the airgap post-deploy-product-smoke-report.json.
        required: true
        default: agentsmith-post-deploy-product-smoke-airgap-report
        type: string
      output_artifact_name:
        description: Artifact name for the final GA report files.
        required: true
        default: agentsmith-ga-release-report
        type: string

permissions:
  contents: read
  actions: read

jobs:
  ga-release:
    name: Final GA aggregate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Download online/use_existing package
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.AGENTSMITH_ARTIFACT_READ_TOKEN || github.token }}
          repository: ${{ inputs.operator_packages_repository }}
          run-id: ${{ inputs.operator_packages_run_id }}
          name: ${{ inputs.online_use_existing_artifact }}
          path: ${{ runner.temp }}/ga-release-inputs/online-use-existing

      - name: Download online/install_substrates package
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.AGENTSMITH_ARTIFACT_READ_TOKEN || github.token }}
          repository: ${{ inputs.operator_packages_repository }}
          run-id: ${{ inputs.operator_packages_run_id }}
          name: ${{ inputs.online_install_substrates_artifact }}
          path: ${{ runner.temp }}/ga-release-inputs/online-install-substrates

      - name: Download airgap/use_existing package
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.AGENTSMITH_ARTIFACT_READ_TOKEN || github.token }}
          repository: ${{ inputs.operator_packages_repository }}
          run-id: ${{ inputs.operator_packages_run_id }}
          name: ${{ inputs.airgap_use_existing_artifact }}
          path: ${{ runner.temp }}/ga-release-inputs/airgap-use-existing

      - name: Download airgap/install_substrates package
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.AGENTSMITH_ARTIFACT_READ_TOKEN || github.token }}
          repository: ${{ inputs.operator_packages_repository }}
          run-id: ${{ inputs.operator_packages_run_id }}
          name: ${{ inputs.airgap_install_substrates_artifact }}
          path: ${{ runner.temp }}/ga-release-inputs/airgap-install-substrates

      - name: Download AgentSmith product readiness report
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.AGENTSMITH_ARTIFACT_READ_TOKEN || github.token }}
          repository: ${{ inputs.product_reports_repository }}
          run-id: ${{ inputs.product_reports_run_id }}
          name: ${{ inputs.product_readiness_artifact }}
          path: ${{ runner.temp }}/ga-release-inputs/product-readiness

      - name: Download AgentSmith online post-deploy product smoke report
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.AGENTSMITH_ARTIFACT_READ_TOKEN || github.token }}
          repository: ${{ inputs.product_reports_repository }}
          run-id: ${{ inputs.product_reports_run_id }}
          name: ${{ inputs.online_post_deploy_product_smoke_artifact }}
          path: ${{ runner.temp }}/ga-release-inputs/post-deploy-product-smoke-online

      - name: Download AgentSmith airgap post-deploy product smoke report
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.AGENTSMITH_ARTIFACT_READ_TOKEN || github.token }}
          repository: ${{ inputs.product_reports_repository }}
          run-id: ${{ inputs.product_reports_run_id }}
          name: ${{ inputs.airgap_post_deploy_product_smoke_artifact }}
          path: ${{ runner.temp }}/ga-release-inputs/post-deploy-product-smoke-airgap

      - name: Run final GA aggregate
        shell: bash
        run: |
          set -euo pipefail

          write_workflow_failure_outputs() {
            local message="$1"
            local exit_code="${2:-1}"

            mkdir -p .ga-release-output
            node --input-type=module - ".ga-release-output" "$message" "$exit_code" <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';

          const [outputDir, message, rawExitCode] = process.argv.slice(2);
          const exitCode = Number.parseInt(rawExitCode, 10);
          const generatedAt = new Date().toISOString();
          const report = {
            schema: 'agentsmith.ga-release-report/v1',
            status: 'fail',
            formal_verdict: 'not_issued',
            generated_at: generatedAt,
            summary: {
              conclusion: 'AgentSmith GA release aggregate blocked before final report upload.'
            },
            blockers: [
              {
                message,
                exit_code: Number.isFinite(exitCode) ? exitCode : 1
              }
            ]
          };

          function stableJson(value) {
            if (Array.isArray(value)) return value.map(stableJson);
            if (value && typeof value === 'object') {
              return Object.fromEntries(Object.keys(value).sort().map((key) => [key, stableJson(value[key])]));
            }
            return value;
          }

          function canonicalDigest(value) {
            return `sha256:${crypto.createHash('sha256').update(JSON.stringify(stableJson(value))).digest('hex')}`;
          }

          const evidenceIndex = {
            schema: 'agentsmith.ga-evidence-index/v1',
            generated_at: generatedAt,
            role: 'derived_from_ga_release_report',
            source_report: {
              path: 'ga-release-report.json',
              schema: report.schema,
              digest: canonicalDigest(report),
              status: report.status,
              formal_verdict: report.formal_verdict
            },
            artifact_index: null,
            deployment_paths: [],
            product_readiness: null,
            post_deploy_product_smoke: null,
            blockers: report.blockers
          };

          const summary = [
            '# AgentSmith GA Release Summary',
            '',
            `Status: ${report.status}`,
            `Formal verdict: ${report.formal_verdict}`,
            '',
            'Blockers:',
            `- ${message}`,
            ''
          ].join('\n');

          fs.mkdirSync(outputDir, { recursive: true });
          fs.writeFileSync(path.join(outputDir, 'ga-release-report.json'), `${JSON.stringify(report, null, 2)}\n`);
          fs.writeFileSync(path.join(outputDir, 'ga-release-summary.md'), summary);
          fs.writeFileSync(path.join(outputDir, 'ga-evidence-index.json'), `${JSON.stringify(evidenceIndex, null, 2)}\n`);
          NODE
          }

          find_one_file() {
            local root="$1"
            local name="$2"
            local label="$3"
            local matches=()

            mapfile -t matches < <(find "$root" -type f -name "$name" | sort)
            if [[ "${#matches[@]}" -ne 1 ]]; then
              local message
              message="$(printf 'expected exactly one %s named %s under %s, found %s' \
                "$label" "$name" "$root" "${#matches[@]}")"
              printf 'error: %s\n' "$message" >&2
              if [[ "${#matches[@]}" -gt 0 ]]; then
                printf '%s\n' "${matches[@]}" >&2
              fi
              write_workflow_failure_outputs "$message" 2
              exit 2
            fi

            printf '%s\n' "${matches[0]}"
          }

          find_package_dir() {
            local root="$1"
            local label="$2"
            dirname "$(find_one_file "$root" operator-inputs.json "$label")"
          }

          ONLINE_USE_EXISTING_PACKAGE="$(
            find_package_dir "$RUNNER_TEMP/ga-release-inputs/online-use-existing" \
              "online/use_existing operator-inputs package"
          )"
          ONLINE_INSTALL_SUBSTRATES_PACKAGE="$(
            find_package_dir "$RUNNER_TEMP/ga-release-inputs/online-install-substrates" \
              "online/install_substrates operator-inputs package"
          )"
          AIRGAP_USE_EXISTING_PACKAGE="$(
            find_package_dir "$RUNNER_TEMP/ga-release-inputs/airgap-use-existing" \
              "airgap/use_existing operator-inputs package"
          )"
          AIRGAP_INSTALL_SUBSTRATES_PACKAGE="$(
            find_package_dir "$RUNNER_TEMP/ga-release-inputs/airgap-install-substrates" \
              "airgap/install_substrates operator-inputs package"
          )"
          PRODUCT_READINESS_REPORT="$(
            find_one_file "$RUNNER_TEMP/ga-release-inputs/product-readiness" \
              product-readiness-report.json "AgentSmith product readiness report"
          )"
          ONLINE_POST_DEPLOY_PRODUCT_SMOKE_REPORT="$(
            find_one_file "$RUNNER_TEMP/ga-release-inputs/post-deploy-product-smoke-online" \
              post-deploy-product-smoke-report.json "AgentSmith online post-deploy product smoke report"
          )"
          AIRGAP_POST_DEPLOY_PRODUCT_SMOKE_REPORT="$(
            find_one_file "$RUNNER_TEMP/ga-release-inputs/post-deploy-product-smoke-airgap" \
              post-deploy-product-smoke-report.json "AgentSmith airgap post-deploy product smoke report"
          )"

          mkdir -p .ga-release-output
          set +e
          bash scripts/operator-release.sh --ga-report \
            --operator-inputs "$ONLINE_USE_EXISTING_PACKAGE" \
            --operator-inputs "$ONLINE_INSTALL_SUBSTRATES_PACKAGE" \
            --operator-inputs "$AIRGAP_USE_EXISTING_PACKAGE" \
            --operator-inputs "$AIRGAP_INSTALL_SUBSTRATES_PACKAGE" \
            --product-readiness-report "$PRODUCT_READINESS_REPORT" \
            --post-deploy-product-smoke-report "$ONLINE_POST_DEPLOY_PRODUCT_SMOKE_REPORT" \
            --post-deploy-product-smoke-report "$AIRGAP_POST_DEPLOY_PRODUCT_SMOKE_REPORT" \
            --output-dir .ga-release-output
          aggregate_status="$?"
          set -e
          if [[ "$aggregate_status" -ne 0 ]]; then
            if [[ ! -f .ga-release-output/ga-release-report.json ]]; then
              write_workflow_failure_outputs \
                "operator-release.sh --ga-report failed before writing ga-release-report.json" \
                "$aggregate_status"
            fi
            exit "$aggregate_status"
          fi

      - name: Publish GA summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .ga-release-output/ga-release-summary.md ]]; then
            cat .ga-release-output/ga-release-summary.md >> "$GITHUB_STEP_SUMMARY"
          elif [[ -f .ga-release-output/ga-release-report.json ]]; then
            printf '%s\n' 'GA report was written, but ga-release-summary.md was not produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify final GA report files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            .ga-release-output/ga-release-report.json \
            .ga-release-output/ga-release-summary.md \
            .ga-release-output/ga-evidence-index.json; do
            if [[ ! -f "$file" ]]; then
              printf 'error: missing final GA output %s\n' "$file" >&2
              exit 1
            fi
          done

      - name: Upload final GA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_artifact_name }}
          path: |
            .ga-release-output/ga-release-report.json
            .ga-release-output/ga-release-summary.md
            .ga-release-output/ga-evidence-index.json
          if-no-files-found: error
